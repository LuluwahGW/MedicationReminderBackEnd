<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medication Reminder System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="hero">
        <button onclick="handleLogout()" id="logout-btn" class="btn-danger" hidden>Logout</button>
        <h1>Medication Reminder</h1>
        <p class="subtitle" id="app-subtitle">Developed by lulu</p>
    </header>

    <div class="container">
        <div id="login-section" class="card login-card">
            <div class="auth-toggle">
                <button type="button" id="tab-signin" class="auth-tab is-active" onclick="showAuthTab('signin')">Sign In</button>
                <button type="button" id="tab-signup" class="auth-tab" onclick="showAuthTab('signup')">Sign Up</button>
            </div>

            <form id="signin-form" onsubmit="event.preventDefault(); handleLogin();">
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" placeholder="you@domain.com" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" placeholder="Your password" required>
                </div>
                <button type="submit" class="btn-primary btn-block">Sign In</button>
            </form>

            <form id="signup-form" onsubmit="event.preventDefault(); handleRegister();" hidden>
                <div class="form-group">
                    <label for="signup-name">Name</label>
                    <input type="text" id="signup-name" placeholder="Jane Doe" required>
                </div>
                <div class="form-group">
                    <label for="signup-email">Email</label>
                    <input type="email" id="signup-email" placeholder="you@domain.com" required>
                </div>
                <div class="form-group">
                    <label for="signup-password">Password</label>
                    <input type="password" id="signup-password" placeholder="Create a password" required>
                    <small class="field-hint">At least 8 characters, with an uppercase letter, a lowercase letter, and a number.</small>
                </div>
                <button type="submit" class="btn-success btn-block">Create Account</button>
            </form>

            <p id="auth-message" class="auth-message" role="status"></p>
        </div>

        <div id="dashboard" style="display:none;">
            <div class="header-actions">
                <h2 id="welcome-msg">Welcome!</h2>
            </div>

            <div class="section card">
                <h3>Add New Medication</h3>
                <div class="form-group">
                    <input type="text" id="med-name" placeholder="Medication Name">
                </div>
                <div class="form-group">
                    <input type="text" id="med-dosage" placeholder="Dosage (e.g., 500mg)">
                </div>
                <button onclick="handleAddMedication()" class="btn-success">Add Medication</button>
            </div>

            <div class="section card">
                <h3>Your Medications</h3>
                <button onclick="fetchMedications()" class="btn-secondary">Refresh List</button>
                <ul id="med-list" class="item-list"></ul>
            </div>
<div class="section card">
                <h3>Your Archived Medications</h3>
                <button onclick="fetchArchivedMedications()" class="btn-secondary">Refresh List</button>
                <ul id="archived-med-list" class="item-list"></ul>
            </div>
            <div class="section card">
                <h3>Set a New Reminder</h3>
                <div class="form-group">
                    <label for="rem-med-id">Select Medication:</label>
                    <select id="rem-med-id">
                        <option value="">-- Choose a Medication --</option>
                    </select>
                </div>
                <div class="form-group">
                    <input type="text" id="rem-name" placeholder="Reminder Title">
                </div>
                <div class="form-group">
                    <label for="rem-time">Time:</label>
                    <input type="datetime-local" id="rem-time">
                </div>
                <div class="form-group">
                    <select id="rem-freq">
                        <option value="ONCE">Once</option>
                        <option value="DAILY">Daily</option>
                        <option value="WEEKLY">Weekly</option>
                        <option value="MONTHLY">Monthly</option>
                    </select>
                </div>
                <div class="form-group">
                    <textarea id="rem-msg" placeholder="Instructions"></textarea>
                </div>
                <button onclick="handleCreateReminder()" class="btn-primary">Set Reminder</button>
            </div>

            <div class="section card motivation-box">
                <h3>Daily Motivation</h3>
                <p id="motivation-display">Click the button for a boost!</p>
                <button onclick="fetchMotivation()" class="btn-secondary">Get Inspired</button>
            </div>

            <div class="blob" aria-hidden="true"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
